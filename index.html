function formSlots(rows,form,F,x,y){const n=F.n,N=rows.length;let cx=0,cy=0;for(const r of rows){cx+=r.u.x;cy+=r.u.y}cx/=N;cy/=N;const a=Math.atan2(y-cy,x-cx),fx=Math.cos(a),fy=Math.sin(a),rx=-fy,ry=fx;const rank=u=>u.D.cls==='cav'?(form==='kama'?0:1):u.D.cls==='sie'?4:u.D.rng?3:u.D.heal?5:(form==='kama'?1:0);const L=rows.slice().sort((p,q)=>rank(p.u)-rank(q.u)||p.d-q.d);const off=[];if(form==='hat'){const w=Math.max(5,Math.ceil(N/2.2));for(let i=0;i<N;i++){const row=(i/w)|0,c=i%w;off.push([-row*1.6,(c-(Math.min(w,N-row*w)-1)/2)*1.25])}}else if(form==='kama'){let row=0,c=0;for(let i=0;i<N;i++){const wd=row*2+1;off.push([-row*1.15,(c-row)*1.15]);if(++c>=wd){c=0;row++}}const b=(off[N-1][0])/2;off.forEach(q=>q[0]-=b)}else if(form==='dagi'){const w=Math.ceil(Math.sqrt(N));for(let i=0;i<N;i++)off.push([-((i/w)|0)*2.6,(i%w-(w-1)/2)*2.6])}else{const w=Math.ceil(Math.sqrt(N));for(let i=0;i<N;i++)off.push([-((i/w)|0)*1.15,(i%w-(w-1)/2)*1.15])}const used=new Set(),out=new Map();let k=0;L.forEach((r,i)=>{const X=Math.round(x+fx*off[i][0]+rx*off[i][1]-.5),Y=Math.round(y+fy*off[i][0]+ry*off[i][1]-.5);let c=X>=0&&Y>=0&&X<n&&Y<n?Y*n+X:-1;if(c<0||F.d[c]<0||used.has(c)){c=-1;for(let rd=1;rd<7&&c<0;rd++)for(let dy=-rd;dy<=rd&&c<0;dy++)for(let dx=-rd;dx<=rd;dx++){const P=X+dx,Q=Y+dy;if(P<0||Q<0||P>=n||Q>=n)continue;const q=Q*n+P;if(F.d[q]>=0&&!used.has(q)){c=q;break}}if(c<0){while(k<F.e&&used.has(F.q[k]))k++;c=F.q[Math.min(k,F.e-1)]}}used.add(c);out.set(r.u,c)});return{out,a}}
